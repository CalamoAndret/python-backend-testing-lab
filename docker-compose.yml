services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB: ${POSTGRES_DB:-testing_lab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: python-backend-testing-lab:local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@db:5432/${POSTGRES_DB:-testing_lab}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: python-backend-testing-lab:local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@db:5432/${POSTGRES_DB:-testing_lab}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@db:5432/testing_lab_test
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@db:5432/testing_lab_test
    command: ["sh", "-c", "alembic upgrade head && alembic check && pytest --cov --cov-report=term-missing --cov-report=xml && python -m scripts.demonstrate_bug"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
